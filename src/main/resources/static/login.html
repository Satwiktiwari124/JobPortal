
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | JobPortal</title>
    <meta name="description"
          content="Login to your JobPortal account and continue exploring opportunities.">

    <link rel="icon" type="image/png" href="/images/jobportal-logo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Existing project CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar bg-white border-bottom">
    <div class="container">

        <!-- JobPortal Logo -->
        <a class="navbar-brand fw-bold fs-4 d-inline-flex align-items-center gap-2"
           href="/"
           aria-label="JobPortal Home">

            <img src="/images/jobportal-logo.png"
                 alt="JobPortal logo"
                 class="brand-logo">

            <span>Job<span class="brand-highlight">Portal</span></span>
        </a>

        <a href="/" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left me-1"></i>
            Home
        </a>

    </div>
</nav>

<!-- Login Section -->
<main class="container py-5">
    <div class="row justify-content-center align-items-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <!-- Heading -->
                    <div class="text-center mb-4">

                        <div class="display-5 text-primary mb-3">
                            <i class="bi bi-person-circle"></i>
                        </div>

                        <h1 class="fw-bold fs-2">Welcome Back!</h1>

                        <p class="text-secondary">
                            Login to continue to JobPortal.
                        </p>

                    </div>

                    <!-- Login Success / Error Message -->
                    <div id="loginMessage"
                         class="alert d-none"
                         role="alert"
                         aria-live="polite">
                    </div>

                    <!-- Existing form ID retained for auth.js -->
                    <form id="loginForm">

                        <!-- Username -->
                        <div class="mb-3">

                            <label for="username"
                                   class="form-label fw-semibold">
                                Username
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-person text-secondary"></i>
                                </span>

                                <input type="text"
                                       class="form-control form-control-lg"
                                       id="username"
                                       name="username"
                                       placeholder="Enter your username"
                                       autocomplete="username"
                                       required>
                            </div>

                        </div>

                        <!-- Password with Eye Toggle -->
                        <div class="mb-4">

                            <label for="password"
                                   class="form-label fw-semibold">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text bg-white">
                                    <i class="bi bi-lock text-secondary"></i>
                                </span>

                                <input type="password"
                                       class="form-control form-control-lg"
                                       id="password"
                                       name="password"
                                       placeholder="Enter your password"
                                       autocomplete="current-password"
                                       required>

                                <button type="button"
                                        class="btn btn-outline-secondary d-flex align-items-center justify-content-center"
                                        id="togglePassword"
                                        aria-label="Show password"
                                        aria-pressed="false"
                                        style="min-width: 48px;">

                                    <svg id="passwordToggleIcon"
                                         xmlns="http://www.w3.org/2000/svg"
                                         width="20"
                                         height="20"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="2"
                                         stroke-linecap="round"
                                         stroke-linejoin="round"
                                         aria-hidden="true">

                                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"></path>
                                        <circle cx="12" cy="12" r="3"></circle>

                                    </svg>
                                </button>

                            </div>
                        </div>

                        <!-- Submit -->
                        <button type="submit"
                                id="loginBtn"
                                class="btn btn-primary btn-lg w-100">

                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Login

                        </button>

                    </form>

                    <!-- Registration Link -->
                    <div class="text-center mt-4">

                        <span class="text-secondary">
                            Don't have an account?
                        </span>

                        <a href="/register.html" class="fw-semibold">
                            Register
                        </a>

                    </div>

                </div>
            </div>

            <p class="text-center text-secondary small mt-4">
                <i class="bi bi-shield-lock me-1"></i>
                Secure login powered by JobPortal.
            </p>

        </div>
    </div>
</main>

<!-- Existing Authentication JavaScript -->
<script src="/js/auth.js"></script>

<!-- Password Visibility -->
<script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const passwordToggleIcon =
        document.getElementById("passwordToggleIcon");

    const eyeIcon = `
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"></path>
        <circle cx="12" cy="12" r="3"></circle>
    `;

    const eyeSlashIcon = `
        <path d="M3 3l18 18"></path>
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
        <path d="M9.9 5.1A11 11 0 0 1 12 4.8c6.5 0 10 7.2 10 7.2a16 16 0 0 1-3.1 4"></path>
        <path d="M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1 0 2-.2 2.9-.5"></path>
    `;

    togglePassword.addEventListener("click", function () {

        const showPassword = passwordInput.type === "password";

        passwordInput.type = showPassword ? "text" : "password";

        passwordToggleIcon.innerHTML =
            showPassword ? eyeSlashIcon : eyeIcon;

        togglePassword.setAttribute(
            "aria-label",
            showPassword ? "Hide password" : "Show password"
        );

        togglePassword.setAttribute(
            "aria-pressed",
            String(showPassword)
        );
    });
</script>

</body>
</html>
