
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | JobPortal</title>
    <meta name="description"
          content="Create your JobPortal account to explore career opportunities.">

    <link rel="icon" type="image/png" href="/images/jobportal-logo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Existing project CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar bg-white border-bottom">
    <div class="container">

        <!-- JobPortal Logo -->
        <a class="navbar-brand fw-bold fs-4 d-inline-flex align-items-center gap-2"
           href="/"
           aria-label="JobPortal Home">

            <img src="/images/jobportal-logo.png"
                 alt="JobPortal logo"
                 class="brand-logo">

            <span>Job<span class="brand-highlight">Portal</span></span>
        </a>

        <a href="/" class="btn btn-outline-primary">
            <i class="bi bi-house me-1"></i>
            Home
        </a>

    </div>
</nav>

<!-- Registration -->
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <!-- Heading -->
                    <div class="text-center mb-4">
                        <div class="display-5 text-primary mb-3">
                            <i class="bi bi-person-plus"></i>
                        </div>

                        <h1 class="fw-bold fs-2">
                            Create Your Account
                        </h1>

                        <p class="text-secondary">
                            Join JobPortal and explore new career opportunities.
                        </p>
                    </div>

                    <!-- Success / Error Message -->
                    <div id="registerMessage"
                         class="alert d-none"
                         role="alert"
                         aria-live="polite">
                    </div>

                    <!-- Existing registration form -->
                    <form id="registerForm">

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username"
                                   class="form-label fw-semibold">
                                Username
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-person text-secondary"></i>
                                </span>

                                <input type="text"
                                       class="form-control form-control-lg"
                                       id="username"
                                       name="username"
                                       placeholder="Choose a username"
                                       autocomplete="username"
                                       minlength="3"
                                       required>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email"
                                   class="form-label fw-semibold">
                                Email Address
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-envelope text-secondary"></i>
                                </span>

                                <input type="email"
                                       class="form-control form-control-lg"
                                       id="email"
                                       name="email"
                                       placeholder="you@example.com"
                                       autocomplete="email"
                                       required>
                            </div>
                        </div>

                        <!-- Account type -->
                        <div class="mb-3">
                            <label for="accountRole" class="form-label fw-semibold">Account Type</label>
                            <select class="form-select form-select-lg" id="accountRole">
                                <option value="USER" selected>Candidate</option>
                                <option value="RECRUITER">Recruiter (invitation code required)</option>
                            </select>
                        </div>
                        <div class="mb-3 d-none" id="recruiterCodeGroup">
                            <label for="recruiterCode" class="form-label fw-semibold">Recruiter Invitation Code</label>
                            <input type="password" class="form-control form-control-lg" id="recruiterCode" autocomplete="off">
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password"
                                   class="form-label fw-semibold">
                                Password
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-lock text-secondary"></i>
                                </span>

                                <input type="password"
                                       class="form-control form-control-lg"
                                       id="password"
                                       name="password"
                                       placeholder="Create a password"
                                       autocomplete="new-password"
                                       minlength="8"
                                       aria-describedby="passwordHelp"
                                       required>

                                <!-- Password visibility toggle -->
                                <button type="button"
                                        class="btn btn-outline-secondary d-flex align-items-center justify-content-center"
                                        id="togglePassword"
                                        aria-label="Show password"
                                        aria-pressed="false"
                                        style="min-width: 48px;">

                                    <svg id="passwordToggleIcon"
                                         xmlns="http://www.w3.org/2000/svg"
                                         width="20"
                                         height="20"
                                         viewBox="0 0 24 24"
                                         fill="none"
                                         stroke="currentColor"
                                         stroke-width="2"
                                         stroke-linecap="round"
                                         stroke-linejoin="round"
                                         aria-hidden="true">

                                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>

                            <div class="form-text mt-2" id="passwordHelp">
                                <i class="bi bi-shield-check me-1"></i>
                                Use at least 8 characters.
                            </div>
                        </div>

                        <!-- Submit -->
                        <button type="submit"
                                id="registerBtn"
                                class="btn btn-primary btn-lg w-100">

                            <i class="bi bi-person-check me-2"></i>
                            Create Account
                        </button>

                    </form>

                    <!-- Login Link -->
                    <div class="text-center mt-4">
                        <span class="text-secondary">
                            Already have an account?
                        </span>

                        <a href="/login.html" class="fw-semibold">
                            Login
                        </a>
                    </div>

                    <!-- Security note -->
                    <div class="text-center mt-4">
                        <small class="text-secondary">
                            <i class="bi bi-shield-lock me-1"></i>
                            Your account details are handled by JobPortal.
                        </small>
                    </div>

                </div>
            </div>

            <p class="text-center text-secondary small mt-4">
                &copy; <span id="currentYear"></span> JobPortal.
                Connecting talent with opportunity.
            </p>

        </div>
    </div>
</main>

<!-- Existing authentication JavaScript -->
<script src="/js/auth.js"></script>

<!-- Password visibility and footer year -->
<script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const passwordToggleIcon =
        document.getElementById("passwordToggleIcon");

    const eyeIcon = `
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"></path>
        <circle cx="12" cy="12" r="3"></circle>
    `;

    const eyeSlashIcon = `
        <path d="M3 3l18 18"></path>
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
        <path d="M9.9 5.1A11 11 0 0 1 12 4.8c6.5 0 10 7.2 10 7.2a16 16 0 0 1-3.1 4"></path>
        <path d="M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1 0 2-.2 2.9-.5"></path>
    `;

    togglePassword.addEventListener("click", function () {
        const showPassword = passwordInput.type === "password";

        passwordInput.type = showPassword ? "text" : "password";

        passwordToggleIcon.innerHTML =
            showPassword ? eyeSlashIcon : eyeIcon;

        togglePassword.setAttribute(
            "aria-label",
            showPassword ? "Hide password" : "Show password"
        );

        togglePassword.setAttribute(
            "aria-pressed",
            String(showPassword)
        );
    });

    document.getElementById("currentYear").textContent =
        new Date().getFullYear();
</script>

</body>
</html>
